name: Investigate macOS URL delivery

on:
  push:
    branches: [fix/macos-url-delivery]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-apple-darwin
          cache-on-failure: true
      - name: Package and exercise native URLs
        env:
          TARGET: x86_64-apple-darwin
          ARCH: x86_64
          RELEASE_TAG: v0.1.86
        run: bash scripts/release/package_macos_assets.sh
      - name: Repeat native URL workload
        run: |
          for attempt in 1 2 3; do
            python3 scripts/release/smoke_macos_app.py \
              --app target/x86_64-apple-darwin/release/bundle/macos/Caelum.app \
              --cli target/x86_64-apple-darwin/release/caelum
          done
