[package]
name = "caelum-desktop"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
license = "MIT"
description = "Caelum's native coding workspace"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7", default-features = false, features = ["accessibility", "metal-backend", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7", features = ["markdown"] }
serde.workspace = true
serde_json.workspace = true
caelum-core = { path = "../../crates/caelum-core" }
caelum-protocol = { path = "../../crates/caelum-protocol" }
wgpu = { version = "~30.0.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
blake3 = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString", "NSUUID"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
