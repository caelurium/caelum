[workspace]
resolver = "3"
members = [
  "crates/caelum-core",
  "crates/caelum-protocol",
  "apps/cli",
  "apps/desktop",
]

[workspace.package]
version = "0.1.169"
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "0.43", features = ["bundled", "backup", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Cargo ignores `[patch.crates-io]` in dependencies; mirror upstream Rune's vendored patches.
[patch.crates-io]
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7" }
naga = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7" }
winit = { git = "https://github.com/anomalyco/rune", rev = "9396dcb898b906c9b542fa28e728738f882cdfd7" }
